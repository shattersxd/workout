  // по умолчанию dark. Тест сверяет оба места.
  (function () {
    var pref = 'dark', mode = 'dark';
    try { var s = localStorage.getItem('sila_theme'); if (s === 'light' || s === 'auto' || s === 'dark') pref = s; } catch (e) {}
    if (pref === 'auto') { try { mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) {} }
    else mode = pref;
    document.documentElement.setAttribute('data-theme', mode);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', mode === 'light' ? '#f2f2f7' : '#0c0c0f');
  })();
  </script>

    /* Статус-бар iPhone при black-translucent всегда с БЕЛЫМ текстом: на светлой странице часы
       пропали бы. Поэтому в светлой теме полоса под статус-баром остаётся тёмной (в Safari
       без установки на экран высота полосы 0). */
    :root[data-theme="light"] body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#0c0c0f;z-index:3000;pointer-events:none}
    /* Анимации приложения. Всё, что движется, помечено классом app-anim: у людей с включённым "уменьшить
       движение" в iOS анимаций нет (тест проверяет правило). */
    @keyframes menuFade{from{opacity:0}to{opacity:1}}
    @keyframes menuSlide{from{transform:translateX(100%)}to{transform:none}}
    @keyframes achIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes achCard{from{opacity:0;transform:scale(.85) translateY(24px)}to{opacity:1;transform:none}}
    @keyframes achPop{0%{opacity:0;transform:scale(.2) rotate(-25deg)}55%{opacity:1;transform:scale(1.25) rotate(8deg)}100%{opacity:1;transform:none}}
    @keyframes achRing{from{opacity:.8;transform:scale(.7)}to{opacity:0;transform:scale(2)}}
    @keyframes achConf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),380px) rotate(var(--rot))}}
    @keyframes achQ{0%,55%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3) rotate(90deg)}}
    @keyframes achText{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){.app-anim,.app-anim *{animation:none!important}}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{height:100%;background:var(--bg-0c0c0f)}
    body{min-height:100%;background:var(--bg-0c0c0f);max-width:100vw}
    body{
      overscroll-behavior-y:contain;
      -webkit-user-select:none;user-select:none;
      -webkit-touch-callout:none;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
      padding-left:env(safe-area-inset-left);
      padding-right:env(safe-area-inset-right);
    }
    input,textarea{-webkit-user-select:text;user-select:text}
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
    input[type=number]{-moz-appearance:textfield}
    input,button,select{font-size:16px}
    button{touch-action:manipulation}
    .wt::placeholder{color:var(--ph);opacity:1}
    ::-webkit-scrollbar{display:none;width:0;height:0}
    *{scrollbar-width:none;-ms-overflow-style:none}
    #root{min-height:100vh;min-height:100dvh}
    #loader{
      position:fixed;inset:0;background:var(--bg-0c0c0f);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      z-index:9999;gap:16px;transition:opacity 0.5s;
    }
    #loader .ico{font-size:52px}
    #loader .lbl{font-family:monospace;font-size:10px;letter-spacing:4px;color:var(--tx-333)}
    #loader .ring{width:48px;height:48px}
    #loader .err{
      font-family:monospace;font-size:11px;color:#ff6b6b;
      text-align:center;max-width:300px;line-height:1.7;
      padding:16px;background:#1a0808;border:1px solid #3a1010;
      border-radius:10px;display:none;margin:0 16px;
    }
    #ios-hint{
      display:none;position:fixed;bottom:20px;left:16px;right:16px;
      background:var(--bg-1a1a22);border:1px solid var(--bd-2a2a35);border-radius:14px;
      padding:18px 16px 16px;z-index:1000;font-family:monospace;
    }
    #ios-hint.show{display:block}
    #ios-hint p{font-size:13px;color:var(--tx-888);line-height:1.8}
    #ios-hint strong{color:var(--tx-fff)}
    #ios-hint .cls{
      position:absolute;top:10px;right:14px;background:none;
      border:none;color:var(--tx-555);font-size:20px;cursor:pointer;padding:4px;
    }
  </style>

<script>
function showErr(msg) {
  var e = document.getElementById('err');
  e.textContent = msg;
  e.style.display = 'block';
  document.getElementById('lbl').textContent = 'ОШИБКА';
  document.getElementById('spin-arc').style.display = 'none';
}
function hideLoader() {
  var l = document.getElementById('loader');
  l.style.opacity = '0';
  setTimeout(function(){ l.style.display = 'none'; }, 500);
}
function setLabel(t) { document.getElementById('lbl').textContent = t; }

function loadScript(url, cb) {
  var s = document.createElement('script');
  s.src = url;
  s.onload = cb;
  s.onerror = function() { showErr('Не удалось загрузить: ' + url.split('/').pop() + '\nПроверь соединение'); };
  document.head.appendChild(s);
}

// Выполнить fn, когда документ разобран целиком (DOMContentLoaded уже мог пройти)
function onDocumentParsed(fn) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
  else fn();
}

window.onerror = function(msg, src, line, col, err) {
  showErr('Ошибка JS:\n' + msg + '\n(строка ' + line + ')');
  return false;
};

setLabel('REACT...');
// Библиотеки лежат в vendor/ (версии и контрольные суммы - в vendor/README.md), а не на CDN:
// приложение запускается без интернета и не зависит от чужого сервера.
loadScript('vendor/react.production.min.js', function() {
  setLabel('REACT DOM...');
  loadScript('vendor/react-dom.production.min.js', function() {
    setLabel('КОМПИЛЯЦИЯ...');
    loadScript('vendor/babel.min.js', function() {
      // Исходник приложения - огромный inline-скрипт в конце страницы. Библиотеки из vendor/ и из
      // кэша воркера приходят мгновенно и могут обогнать разбор страницы: тогда textContent оборван
      // на середине, и Babel падает с "Unterminated string constant". Компилируем, только когда
      // документ разобран целиком.
      onDocumentParsed(function() {
      try {
        setLabel('ЗАПУСК...');
        var code = document.getElementById('app-src').textContent;
        var compiled = Babel.transform(code, {
          presets: [['react', {}]],
          plugins: [],
          filename: 'app.jsx'
        }).code;
        var run = new Function('React', 'ReactDOM', compiled);
        run(React, ReactDOM);
        hideLoader();

        // iOS install hint
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        var isSafari = /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS/.test(navigator.userAgent);
        if (isIOS && isSafari && !window.navigator.standalone) {
          setTimeout(function(){ document.getElementById('ios-hint').classList.add('show'); }, 2000);
        }

        // Service worker for offline: настоящий файл sw.js (blob-воркеры не регистрируются)
        if ('serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.register('sw.js').catch(function() {});
          } catch(e2) {}
        }
      } catch(e) {
        showErr('Ошибка компиляции:\n' + e.message);
        console.error(e);
      }
      });
    });
  });
});
</script>
