  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{height:100%;background:#0c0c0f}
    body{min-height:100%;background:#0c0c0f;max-width:100vw}
    body{
      overscroll-behavior-y:contain;
      -webkit-user-select:none;user-select:none;
      -webkit-touch-callout:none;
      padding-top:env(safe-area-inset-top);
      padding-bottom:env(safe-area-inset-bottom);
      padding-left:env(safe-area-inset-left);
      padding-right:env(safe-area-inset-right);
    }
    input,textarea{-webkit-user-select:text;user-select:text}
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
    input[type=number]{-moz-appearance:textfield}
    input,button,select{font-size:16px}
    button{touch-action:manipulation}
    .wt::placeholder{color:#6f6f80;opacity:1}
    ::-webkit-scrollbar{display:none;width:0;height:0}
    *{scrollbar-width:none;-ms-overflow-style:none}
    #root{min-height:100vh;min-height:100dvh}
    #loader{
      position:fixed;inset:0;background:#0c0c0f;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      z-index:9999;gap:16px;transition:opacity 0.5s;
    }
    #loader .ico{font-size:52px}
    #loader .lbl{font-family:monospace;font-size:10px;letter-spacing:4px;color:#333}
    #loader .ring{width:48px;height:48px}
    #loader .err{
      font-family:monospace;font-size:11px;color:#ff6b6b;
      text-align:center;max-width:300px;line-height:1.7;
      padding:16px;background:#1a0808;border:1px solid #3a1010;
      border-radius:10px;display:none;margin:0 16px;
    }
    #ios-hint{
      display:none;position:fixed;bottom:20px;left:16px;right:16px;
      background:#1a1a22;border:1px solid #2a2a35;border-radius:14px;
      padding:18px 16px 16px;z-index:1000;font-family:monospace;
    }
    #ios-hint.show{display:block}
    #ios-hint p{font-size:13px;color:#888;line-height:1.8}
    #ios-hint strong{color:#fff}
    #ios-hint .cls{
      position:absolute;top:10px;right:14px;background:none;
      border:none;color:#555;font-size:20px;cursor:pointer;padding:4px;
    }
  </style>
</head>
<body>

<div id="loader">
  <div class="ico">🏋️</div>
  <svg class="ring" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="20" fill="none" stroke="#1a1a22" stroke-width="3"/>
    <circle id="spin-arc" cx="24" cy="24" r="20" fill="none" stroke="#ff6b35"
      stroke-width="3" stroke-linecap="round"
      stroke-dasharray="30 96" transform="rotate(-90 24 24)">
      <animateTransform attributeName="transform" type="rotate"
        from="-90 24 24" to="270 24 24" dur="1s" repeatCount="indefinite"/>
    </circle>
  </svg>
  <div class="lbl" id="lbl">ЗАГРУЗКА</div>
  <div class="err" id="err"></div>
</div>

<div id="root"></div>

<div id="ios-hint">
  <button class="cls" onclick="document.getElementById('ios-hint').classList.remove('show')">✕</button>
  <p>Чтобы установить на iPhone:<br>
  Нажми <strong>⬆ Поделиться</strong> внизу Safari<br>
  → <strong>«На экран «Домой»»</strong> → <strong>«Добавить»</strong></p>
</div>

<script>
function showErr(msg) {
  var e = document.getElementById('err');
  e.textContent = msg;
  e.style.display = 'block';
  document.getElementById('lbl').textContent = 'ОШИБКА';
  document.getElementById('spin-arc').style.display = 'none';
}
function hideLoader() {
  var l = document.getElementById('loader');
  l.style.opacity = '0';
  setTimeout(function(){ l.style.display = 'none'; }, 500);
}
function setLabel(t) { document.getElementById('lbl').textContent = t; }

function loadScript(url, cb) {
  var s = document.createElement('script');
  s.src = url;
  s.onload = cb;
  s.onerror = function() { showErr('Не удалось загрузить: ' + url.split('/').pop() + '\nПроверь соединение'); };
  document.head.appendChild(s);
}

// Выполнить fn, когда документ разобран целиком (DOMContentLoaded уже мог пройти)
function onDocumentParsed(fn) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
  else fn();
}

window.onerror = function(msg, src, line, col, err) {
  showErr('Ошибка JS:\n' + msg + '\n(строка ' + line + ')');
  return false;
};

setLabel('REACT...');
// Библиотеки лежат в vendor/ (версии и контрольные суммы - в vendor/README.md), а не на CDN:
// приложение запускается без интернета и не зависит от чужого сервера.
loadScript('vendor/react.production.min.js', function() {
  setLabel('REACT DOM...');
  loadScript('vendor/react-dom.production.min.js', function() {
    setLabel('КОМПИЛЯЦИЯ...');
    loadScript('vendor/babel.min.js', function() {
      // Исходник приложения - огромный inline-скрипт в конце страницы. Библиотеки из vendor/ и из
      // кэша воркера приходят мгновенно и могут обогнать разбор страницы: тогда textContent оборван
      // на середине, и Babel падает с "Unterminated string constant". Компилируем, только когда
      // документ разобран целиком.
      onDocumentParsed(function() {
      try {
        setLabel('ЗАПУСК...');
        var code = document.getElementById('app-src').textContent;
        var compiled = Babel.transform(code, {
          presets: [['react', {}]],
          plugins: [],
          filename: 'app.jsx'
        }).code;
        var run = new Function('React', 'ReactDOM', compiled);
        run(React, ReactDOM);
        hideLoader();

        // iOS install hint
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        var isSafari = /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS/.test(navigator.userAgent);
        if (isIOS && isSafari && !window.navigator.standalone) {
          setTimeout(function(){ document.getElementById('ios-hint').classList.add('show'); }, 2000);
        }

        // Service worker for offline: настоящий файл sw.js (blob-воркеры не регистрируются)
        if ('serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.register('sw.js').catch(function() {});
          } catch(e2) {}
        }
      } catch(e) {
        showErr('Ошибка компиляции:\n' + e.message);
        console.error(e);
      }
      });
    });
  });
});
</script>
