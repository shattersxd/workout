name: build & test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: index.html matches src/
        run: python3 scripts/build.py --check

      - name: regression suite
        run: node tests/test_pwa.js
